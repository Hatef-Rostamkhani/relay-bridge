name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to publish (example: v1.2.0). Leave empty for build-only run."
        required: false
        type: string
      publish:
        description: "Publish GitHub release"
        required: false
        default: false
        type: boolean
      make_public:
        description: "For manual runs, make release public immediately (false = draft + prerelease). Tag pushes are public."
        required: false
        default: false
        type: boolean
      include_termux:
        description: "Publish Termux ARM64 bundle; ARMv7 is best-effort"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: amd64
            optional: false
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            optional: false
          - os: macos-13
            platform: macos
            arch: amd64
            optional: false
          - os: macos-14
            platform: macos
            arch: arm64
            optional: false
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            optional: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone binary
        run: pyinstaller --noconfirm --clean --onefile --name RelayBridge --paths src main.py

      - name: Smoke test binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="dist/RelayBridge.exe"
          else
            BIN="dist/RelayBridge"
            chmod +x "$BIN"
          fi
          "$BIN" --version
          "$BIN" --help >/dev/null

      - name: Package release artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $content = Get-Content "src/core/constants.py" -Raw
          $m = [regex]::Match($content, '__version__\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw "Could not read version from src/core/constants.py" }
          $version = $m.Groups[1].Value
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          $staging = "release-staging"
          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "dist/RelayBridge.exe" "$staging/RelayBridge.exe"
          foreach ($f in @("README.md", "README_FA.md", "config.example.json", "start.bat", "start.sh")) {
            if (Test-Path $f) { Copy-Item $f $staging }
          }
          $archive = "RelayBridge-$version-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath "release-assets/$archive" -Force
          $hash = (Get-FileHash "release-assets/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "release-assets/$archive.sha256" -Encoding ascii

      - name: Package release artifact (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import re
          from pathlib import Path
          t = Path('src/core/constants.py').read_text(encoding='utf-8')
          m = re.search(r'__version__\s*=\s*"([^"]+)"', t)
          print(m.group(1) if m else '0.0.0')
          PY
          )
          mkdir -p release-assets release-staging
          rm -rf release-staging/*
          cp dist/RelayBridge release-staging/RelayBridge
          chmod +x release-staging/RelayBridge
          for f in README.md README_FA.md config.example.json start.sh start.bat; do
            [ -f "$f" ] && cp "$f" release-staging/
          done
          archive="RelayBridge-${version}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar -C release-staging -czf "release-assets/$archive" .
          ARCHIVE_NAME="$archive" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          archive = Path("release-assets") / os.environ["ARCHIVE_NAME"]
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (archive.parent / f"{archive.name}.sha256").write_text(
              f"{digest}  {archive.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*

  build-termux:
    name: Build termux-arm64
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' || github.event.inputs.include_termux == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU for cross-arch containers
        uses: docker/setup-qemu-action@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Termux binaries
        shell: bash
        run: |
          set -euo pipefail

          version=$(python - <<'PY'
          import re
          from pathlib import Path
          t = Path('src/core/constants.py').read_text(encoding='utf-8')
          m = re.search(r'__version__\s*=\s*"([^"]+)"', t)
          print(m.group(1) if m else '0.0.0')
          PY
          )

          mkdir -p release-assets termux-dist

          # Build using Alpine Linux with QEMU for cross-compilation
          # This is more reliable than depending on Termux Docker images
          build_termux_arch () {
            local arch="$1"
            local platform="$2"
            local qemu_arch="$3"

            echo "Building for Termux ${arch}..."
            rm -rf dist build *.spec || true

            # Use Alpine with QEMU for reliable cross-platform builds
            if ! docker run --rm --platform "$platform" \
              -e ARCH="$arch" \
              -v "$PWD:/work" \
              -w /work \
              alpine:latest \
              sh -c '
                set -euo pipefail
                echo "Installing build dependencies..."
                apk add --no-cache python3 python3-dev py3-pip py3-virtualenv make gcc musl-dev zlib-dev openssl-dev libffi-dev rust cargo
                echo "Installing Python packages..."
                python3 -m venv /tmp/relaybridge-venv
                . /tmp/relaybridge-venv/bin/activate
                python -m pip install --upgrade pip pyinstaller
                pip install -r requirements.txt
                echo "Building binary for ${ARCH}..."
                pyinstaller --noconfirm --clean --onefile --name RelayBridge --paths src main.py
              '; then
              echo "ERROR: Container build failed for ${arch}" >&2
              return 1
            fi

            if [ ! -f dist/RelayBridge ]; then
              echo "ERROR: Missing binary output for ${arch}" >&2
              return 1
            fi
            cp dist/RelayBridge "termux-dist/RelayBridge-${arch}"
            chmod +x "termux-dist/RelayBridge-${arch}"
            echo "✓ Successfully built for ${arch}"
          }

          # ARM64 is the primary supported Termux target. ARMv7 is best-effort
          # because current Python/Rust wheels often require fragile source builds.
          build_termux_arch "arm64" "linux/arm64" "aarch64"
          if ! build_termux_arch "armv7" "linux/arm/v7" "arm"; then
            echo "::warning::Termux armv7 build failed; publishing arm64 Termux bundle only."
          fi

          echo ""
          echo "Packaging releases..."
          for binary in termux-dist/RelayBridge-*; do
            [ -f "$binary" ] || continue
            arch="${binary##*-}"
            staging="termux-staging-${arch}"
            rm -rf "$staging"
            mkdir -p "$staging"
            cp "$binary" "$staging/RelayBridge"
            chmod +x "$staging/RelayBridge"
            
            [ -f config.example.json ] && cp config.example.json "$staging/"
            [ -f README.md ] && cp README.md "$staging/"
            [ -f README_FA.md ] && cp README_FA.md "$staging/"

            # Create Termux launch script for native Termux environment
            printf '%s\n' \
              '#!/data/data/com.termux/files/usr/bin/bash' \
              'set -euo pipefail' \
              'chmod +x ./RelayBridge' \
              'exec ./RelayBridge "$@"' \
              > "$staging/termux-run.sh"
            chmod +x "$staging/termux-run.sh"

            archive="RelayBridge-${version}-termux-${arch}.zip"
            (cd "$staging" && zip -qr "../release-assets/${archive}" .)

            # Generate checksum
            python3 -c 'import hashlib, pathlib, sys; archive = pathlib.Path("release-assets") / sys.argv[1]; digest = hashlib.sha256(archive.read_bytes()).hexdigest(); archive.with_suffix(archive.suffix + ".sha256").write_text(f"{digest}  {archive.name}\n", encoding="utf-8")' "$archive"
            echo "✓ Packaged: $archive"
          done
          
          echo ""
          ls -lah release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-termux
          path: release-assets/*

  build-docker-archives:
    name: Build Docker archive ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve archive metadata
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag || '' }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="sha-${GITHUB_SHA::7}"
          fi

          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag derived from release tag: $tag" >&2
            exit 1
          fi

          archive="RelayBridge-docker-${tag}-linux-${{ matrix.arch }}.tar.gz"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image for archive
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --tag "relaybridge:${{ steps.archive.outputs.tag }}" \
            --load \
            .

      - name: Package and verify Docker archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          docker image save "relaybridge:${{ steps.archive.outputs.tag }}" | gzip -9 > "release-assets/${{ steps.archive.outputs.archive }}"

          (
            cd release-assets
            gzip -t "${{ steps.archive.outputs.archive }}"
            sha256sum "${{ steps.archive.outputs.archive }}" > "${{ steps.archive.outputs.archive }}.sha256"
            sha256sum -c "${{ steps.archive.outputs.archive }}.sha256"
          )

          docker image rm "relaybridge:${{ steps.archive.outputs.tag }}" >/dev/null 2>&1 || true
          docker load -i "release-assets/${{ steps.archive.outputs.archive }}"
          docker run --rm --platform "${{ matrix.platform }}" "relaybridge:${{ steps.archive.outputs.tag }}" python main.py --version

      - name: Upload Docker archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-docker-${{ matrix.arch }}
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-termux, build-docker-archives]
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && startsWith(github.event.inputs.release_tag, 'v')))

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Flatten artifact directories
        run: |
          mkdir -p final-assets
          find release-assets -type f -exec cp {} final-assets/ \;
          ls -lah final-assets

      - name: Fail if no artifacts
        run: |
          set -euo pipefail
          count=$(find final-assets -type f | wc -l)
          echo "Artifact count: ${count}"
          if [ "${count}" -eq 0 ]; then
            echo "No artifacts were produced."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          files: final-assets/*
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.make_public != 'true' }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.make_public != 'true' }}
          make_latest: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.make_public == 'true')) && 'true' || 'false' }}
