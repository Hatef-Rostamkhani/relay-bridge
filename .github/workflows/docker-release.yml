name: Docker Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: "Push image to GitHub Container Registry"
        required: false
        default: true
        type: boolean
      image_name:
        description: "Optional GHCR image path without ghcr.io, for example owner/relaybridge"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEFAULT_IMAGE_NAME: relaybridge

jobs:
  docker-image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          input_name="${{ github.event.inputs.image_name || '' }}"

          if [ -n "$input_name" ]; then
            image_path="$(printf '%s' "$input_name" | tr '[:upper:]' '[:lower:]')"
          else
            image_path="${owner}/${DEFAULT_IMAGE_NAME}"
          fi

          echo "image=${REGISTRY}/${image_path}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'main' || github.ref_name == 'master' }}
          labels: |
            org.opencontainers.image.title=RelayBridge
            org.opencontainers.image.description=Local HTTP/SOCKS5 relay proxy with Google Apps Script transport
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Decide whether to push
        id: push
        shell: bash
        run: |
          set -euo pipefail

          push_image=false
          if [ "${{ github.event_name }}" = "push" ]; then
            push_image=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" = "true" ]; then
            push_image=true
          fi

          echo "push=${push_image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-archive:
    name: Build downloadable Docker archive (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve archive metadata
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          tag="sha-${short_sha}"
          archive="RelayBridge-docker-${tag}-linux-${{ matrix.arch }}.tar.gz"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image for archive
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --tag "relaybridge:${{ steps.archive.outputs.tag }}" \
            --load \
            .

      - name: Package and verify Docker archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docker-archives
          docker image save "relaybridge:${{ steps.archive.outputs.tag }}" | gzip -9 > "docker-archives/${{ steps.archive.outputs.archive }}"

          (
            cd docker-archives
            gzip -t "${{ steps.archive.outputs.archive }}"
            sha256sum "${{ steps.archive.outputs.archive }}" > "${{ steps.archive.outputs.archive }}.sha256"
            sha256sum -c "${{ steps.archive.outputs.archive }}.sha256"
          )

          docker image rm "relaybridge:${{ steps.archive.outputs.tag }}" >/dev/null 2>&1 || true
          docker load -i "docker-archives/${{ steps.archive.outputs.archive }}"
          docker run --rm --platform "${{ matrix.platform }}" "relaybridge:${{ steps.archive.outputs.tag }}" python main.py --version

      - name: Upload Docker archive
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ steps.archive.outputs.tag }}-linux-${{ matrix.arch }}
          path: docker-archives/*
          retention-days: 30
